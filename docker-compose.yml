# Plain HTTP on port 80:   docker compose up -d --build
# HTTPS with a domain:     set DOMAIN in .env, then: docker compose --profile https up -d --build
services:
  game:
    build: .
    restart: unless-stopped
    ports:
      - "${GAME_PORT:-80}:3000"

  caddy:
    profiles: ["https"]
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to game:3000
    volumes:
      - caddy_data:/data
    depends_on:
      - game

volumes:
  caddy_data:
